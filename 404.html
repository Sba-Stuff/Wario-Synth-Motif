<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>It’s not me ah Wario — Wario Synth</title>
  <link rel="icon" href="/wario-sprite.png">
  <link rel="stylesheet" href="/src/styles/wario.css">
  <style>
    body { min-height: 100svh; display: grid; place-items: center; }
    .lost { width: min(100%, 480px); text-align: center; border: 4px solid var(--gb-dark); padding: clamp(24px, 5vw, 36px); background: var(--gb-shell); box-shadow: 8px 8px 0 var(--gb-shell-dark); }
    .label { letter-spacing: 3px; font-size: 9px; }
    .code { font-size: clamp(64px, 18vw, 112px); line-height: 1.3; margin: 16px 0 0; text-shadow: 4px 4px var(--gb-light); }
    .sprite { width: 88px; height: 88px; object-fit: contain; mix-blend-mode: multiply; margin: 14px auto; display: block; }
    h1 { font-size: clamp(16px, 4vw, 24px); line-height: 1.7; margin: 12px 0 24px; }
    .home { display: inline-block; padding: 16px 20px; background: var(--gb-darkest); color: var(--gb-lightest); border: 4px solid var(--gb-dark); text-decoration: none; box-shadow: 4px 4px 0 var(--gb-shell-dark); }
    .home:focus-visible, button:focus-visible { outline: 3px dashed var(--gb-darkest); outline-offset: 5px; }
    .timer { margin: 20px 0 0; font-size: 8px; }
    .stay { font: inherit; font-size: 8px; background: transparent; border: 0; box-shadow: none; padding: 8px; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <main class="lost">
    <p class="label">WARIO SYNTH</p>
    <p class="code" aria-label="Error 404">404</p>
    <img class="sprite" src="/wario-sprite.png" alt="Wario">
    <h1>It’s not me ah Wario</h1>
    <a class="home" href="/">BACK TO MUSIC</a>
    <div class="timer"><span id="countdown" hidden>Home in <span id="seconds">8</span>s</span> <button class="stay" id="stay" type="button" hidden>Cancel</button></div>
  </main>
  <script type="module">
    const countdown = document.getElementById('countdown');
    const seconds = document.getElementById('seconds');
    const stay = document.getElementById('stay');
    countdown.hidden = false;
    stay.hidden = false;
    let remaining = 8;
    const timer = window.setInterval(() => {
      if (document.hidden) return;
      remaining -= 1;
      seconds.textContent = String(remaining);
      if (remaining <= 0) { window.clearInterval(timer); window.location.replace('/'); }
    }, 1000);
    stay.addEventListener('click', () => {
      window.clearInterval(timer);
      countdown.textContent = 'Redirect cancelled.';
      stay.hidden = true;
      document.querySelector('.home').focus();
    });
  </script>
</body>
</html>
